# Serves the built single-page app and forwards API calls, so the browser only ever talks to this origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS; resolving "api" per request lets nginx start before (or without) the API container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every app path (/callback, /silent-callback, future routes) loads the app.
    location / {
        try_files $uri /index.html;
    }
}
